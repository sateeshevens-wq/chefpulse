name: ChefPulse One-off TypeScript Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix: apply TypeScript repairs') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply targeted TypeScript repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('src/App.tsx')
          text = app.read_text()
          old = 'address: u.address || `${area.name}, ${city.name}`,'
          new = 'address: u.address || `${INDIAN_CITIES[0].areas[0].name}, ${INDIAN_CITIES[0].name}`,'
          if old not in text:
              raise SystemExit('Expected App.tsx address expression not found')
          app.write_text(text.replace(old, new, 1))

          grocery = Path('server/services/groceryOrderService.ts')
          text = grocery.read_text()
          old = 'const assertPartner = (partner: string): asserts partner is GroceryPartner => {'
          new = 'const assertPartner: (partner: string) => asserts partner is GroceryPartner = (partner: string): asserts partner is GroceryPartner => {'
          if old not in text:
              raise SystemExit('Expected grocery assertion declaration not found')
          grocery.write_text(text.replace(old, new, 1))

          tests = Path('tests/backend.test.ts')
          text = tests.read_text()
          text, count = re.subn(r'(\n\s*)const (\w+) = queryOne<any>\(', r'\1const \2 = await queryOne<any>(', text)
          if count == 0:
              raise SystemExit('No backend queryOne assignments were found to repair')
          tests.write_text(text)
          print(f'Repaired {count} backend queryOne assignments')
          PY

      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx server/services/groceryOrderService.ts tests/backend.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: apply TypeScript repairs"
          git push origin main
