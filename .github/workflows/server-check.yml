name: ChefPulse Server Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Backend tests
        run: npm test
