name: Import V24 source from Google Drive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download V24.2 source archive
        run: |
          python -m pip install --upgrade gdown
          gdown 'https://drive.google.com/uc?id=1_PZ3Mq5X8mILvFCVInEE1MAc_zG7DWre' -O /tmp/chefpulse-v24.2.zip

      - name: Extract source
        run: |
          rm -rf /tmp/chefpulse-v24.2
          mkdir -p /tmp/chefpulse-v24.2
          unzip -q /tmp/chefpulse-v24.2.zip -d /tmp/chefpulse-v24.2
          test -f /tmp/chefpulse-v24.2/package.json
          test -d /tmp/chefpulse-v24.2/src
          test -d /tmp/chefpulse-v24.2/server
          # GitHub's Actions token cannot create/update workflow files.
          # Keep the repository's existing workflow files and import the app source.
          rm -rf /tmp/chefpulse-v24.2/.github/workflows
          cp -a /tmp/chefpulse-v24.2/. .
          rm -f /tmp/chefpulse-v24.2.zip
          rm -rf /tmp/chefpulse-v24.2

      - name: Preserve cloud-build dependency compatibility
        run: |
          node -e "const fs=require('fs'); const p='package.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); j.devDependencies=j.devDependencies||{}; j.devDependencies.esbuild='^0.28.2'; fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n')"
          node -e "const j=require('./package.json'); if(!j.devDependencies.esbuild.startsWith('^0.28.')) process.exit(1)"

      - name: Commit imported V24 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import V24 source from Drive" || exit 0
          git push origin main
