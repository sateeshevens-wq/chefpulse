name: ChefPulse Android Release Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build:web

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Restore ChefPulse upload keystore
        env:
          CHEFPULSE_KEYSTORE_BASE64: ${{ secrets.CHEFPULSE_KEYSTORE_BASE64 }}
        run: |
          test -n "$CHEFPULSE_KEYSTORE_BASE64"
          mkdir -p android-signing
          printf '%s' "$CHEFPULSE_KEYSTORE_BASE64" | base64 --decode > android-signing/chefpulse-upload-keystore.jks
          chmod 600 android-signing/chefpulse-upload-keystore.jks

      - name: Configure ChefPulse release signing
        env:
          CHEFPULSE_KEYSTORE_PATH: ${{ github.workspace }}/android-signing/chefpulse-upload-keystore.jks
          CHEFPULSE_KEYSTORE_PASSWORD: ${{ secrets.CHEFPULSE_KEYSTORE_PASSWORD }}
          CHEFPULSE_KEY_ALIAS: ${{ secrets.CHEFPULSE_KEY_ALIAS }}
          CHEFPULSE_KEY_PASSWORD: ${{ secrets.CHEFPULSE_KEY_PASSWORD }}
        run: bash scripts/configure-android-signing.sh

      - name: Build signed release APK and AAB
        working-directory: android
        env:
          CHEFPULSE_KEYSTORE_PATH: ${{ github.workspace }}/android-signing/chefpulse-upload-keystore.jks
          CHEFPULSE_KEYSTORE_PASSWORD: ${{ secrets.CHEFPULSE_KEYSTORE_PASSWORD }}
          CHEFPULSE_KEY_ALIAS: ${{ secrets.CHEFPULSE_KEY_ALIAS }}
          CHEFPULSE_KEY_PASSWORD: ${{ secrets.CHEFPULSE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify release APK signature
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Verify release AAB signature
        run: |
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)
          test -n "$AAB"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          echo "ChefPulse release AAB signature verified."

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ChefPulse-Android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ChefPulse-Android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Clean signing material
        if: always()
        run: rm -rf android-signing
