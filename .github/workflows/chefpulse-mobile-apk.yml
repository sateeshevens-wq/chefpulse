name: ChefPulse Mobile APK

on:
  push:
    branches:
      - mobile-sdk57-chefpulse
      - mobile-services-screen
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        run: |
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | head -80 || true
          "$ANDROID_HOME/platform-tools/adb" version || true

      - name: Install dependencies
        run: npm install

      - name: Install Expo-compatible native dependencies
        run: npx expo install expo-linear-gradient expo-location expo-status-bar @react-navigation/native @react-navigation/native-stack @react-navigation/bottom-tabs react-native-safe-area-context react-native-screens

      - name: Validate Expo project
        run: npx expo-doctor

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Enforce ChefPulse launcher icon assets
        run: |
          ICON_DIR="android/app/src/main/res"
          mkdir -p "$ICON_DIR/drawable-nodpi" "$ICON_DIR/mipmap-mdpi" "$ICON_DIR/mipmap-hdpi" "$ICON_DIR/mipmap-xhdpi" "$ICON_DIR/mipmap-xxhdpi" "$ICON_DIR/mipmap-xxxhdpi" "$ICON_DIR/mipmap-anydpi-v26"
          cp assets/app_icon.png "$ICON_DIR/mipmap-mdpi/ic_launcher.png"
          cp assets/app_icon.png "$ICON_DIR/drawable-nodpi/ic_launcher_foreground.png"
          for density in hdpi xhdpi xxhdpi xxxhdpi; do
            cp assets/app_icon.png "$ICON_DIR/mipmap-$density/ic_launcher.png"
            cp assets/app_icon.png "$ICON_DIR/mipmap-$density/ic_launcher_round.png"
          done
          cp assets/app_icon.png "$ICON_DIR/mipmap-mdpi/ic_launcher_round.png"
          cat > "$ICON_DIR/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@android:color/black" />
            <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          XML
          cp "$ICON_DIR/mipmap-anydpi-v26/ic_launcher.xml" "$ICON_DIR/mipmap-anydpi-v26/ic_launcher_round.xml"
          test -f "$ICON_DIR/mipmap-mdpi/ic_launcher.png"
          test -f "$ICON_DIR/mipmap-anydpi-v26/ic_launcher.xml"

      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: mobile/android

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChefPulse-Android-SDK57
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
