name: ChefPulse Mobile Android Release

on:
  push:
    branches:
      - mobile-sdk57-chefpulse
      - mobile-services-screen
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image validation tools
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick python3-pil

      - name: Verify and normalize source image assets
        run: |
          test -f assets/image_0.png
          test -f assets/app_icon.png
          file assets/image_0.png assets/app_icon.png
          python3 - <<'PY'
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          image = Image.open('assets/image_0.png')
          image.load()
          image.convert('RGBA').save('assets/splash_logo.png', 'PNG')
          PY
          convert assets/app_icon.png -strip -alpha on -define png:color-type=6 assets/app_icon_normalized.png
          mv assets/app_icon_normalized.png assets/app_icon.png
          file assets/splash_logo.png assets/app_icon.png
          identify assets/splash_logo.png assets/app_icon.png

      - name: Verify safe asset filenames
        run: |
          find assets -type f -print | while read -r file; do
            name="$(basename "$file")"
            if ! printf '%s\n' "$name" | grep -Eq '^[a-z0-9_]+\.(png|jpg|jpeg|webp)$'; then
              echo "Invalid asset filename: $file"
              exit 1
            fi
          done

      - name: Remove stale native Android resources
        run: rm -rf android

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Install Expo-compatible native dependencies
        run: npx expo install expo-constants expo-notifications expo-linear-gradient expo-location expo-status-bar @react-navigation/native @react-navigation/native-stack @react-navigation/bottom-tabs react-native-safe-area-context react-native-screens

      - name: Validate Expo project
        run: npx expo-doctor

      - name: Generate clean Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Remove duplicate or invalid generated image resources
        run: |
          RES_DIR="android/app/src/main/res"
          rm -f "$RES_DIR"/drawable*/assets_image_0.png
          rm -f "$RES_DIR"/drawable*/image_0.png
          rm -f "$RES_DIR"/drawable*/splash_logo.png
          rm -f "$RES_DIR"/drawable*/splash_logo.webp
          find "$RES_DIR" -type f -print | while read -r file; do
            base="$(basename "$file")"
            stem="${base%.*}"
            if ! printf '%s\n' "$stem" | grep -Eq '^[a-z0-9_]+$'; then
              echo "Invalid Android resource filename: $file"
              exit 1
            fi
          done

      - name: Enforce ChefPulse launcher icon assets
        run: |
          ICON_DIR="android/app/src/main/res"
          mkdir -p "$ICON_DIR/drawable-nodpi" "$ICON_DIR/mipmap-mdpi" "$ICON_DIR/mipmap-hdpi" "$ICON_DIR/mipmap-xhdpi" "$ICON_DIR/mipmap-xxhdpi" "$ICON_DIR/mipmap-xxxhdpi" "$ICON_DIR/mipmap-anydpi-v26"
          rm -f "$ICON_DIR"/mipmap-*/ic_launcher*.webp
          cp assets/app_icon.png "$ICON_DIR/mipmap-mdpi/ic_launcher.png"
          cp assets/app_icon.png "$ICON_DIR/drawable-nodpi/ic_launcher_foreground.png"
          for density in hdpi xhdpi xxhdpi xxxhdpi; do
            cp assets/app_icon.png "$ICON_DIR/mipmap-$density/ic_launcher.png"
            cp assets/app_icon.png "$ICON_DIR/mipmap-$density/ic_launcher_round.png"
          done
          cp assets/app_icon.png "$ICON_DIR/mipmap-mdpi/ic_launcher_round.png"
          cat > "$ICON_DIR/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@android:color/black" />
            <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          XML
          cp "$ICON_DIR/mipmap-anydpi-v26/ic_launcher.xml" "$ICON_DIR/mipmap-anydpi-v26/ic_launcher_round.xml"
          test -f "$ICON_DIR/mipmap-mdpi/ic_launcher.png"
          test -f "$ICON_DIR/mipmap-anydpi-v26/ic_launcher.xml"

      - name: Gradle clean
        run: ./gradlew clean
        working-directory: mobile/android

      - name: Build release APK and AAB
        run: ./gradlew assembleRelease bundleRelease
        working-directory: mobile/android

      - name: Verify release APK and AAB
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          test -f android/app/build/outputs/bundle/release/app-release.aab
          ls -lh android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChefPulse-Android-Release-SDK57
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
