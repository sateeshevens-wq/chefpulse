name: ChefPulse Mobile APK

on:
  push:
    branches:
      - mobile-sdk57-chefpulse
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Install Expo-compatible native dependencies
        run: npx expo install expo-linear-gradient expo-location @react-navigation/native @react-navigation/native-stack

      - name: Validate Expo project
        run: npx expo-doctor

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: mobile/android

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChefPulse-Android-SDK57
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
