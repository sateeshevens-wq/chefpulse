<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="6"/>

  <!-- Chef Hat Icon -->
  <g transform="translate(136, 96)" fill="url(#amberGrad)">
    <!-- Main hat folds -->
    <path d="M120 18 C70 18 36 60 48 110 C20 120 0 148 0 182 C0 226 34 262 78 266 L162 266 C206 262 240 226 240 182 C240 148 220 120 192 110 C204 60 170 18 120 18 Z" />
    <!-- Hat band / brim -->
    <rect x="36" y="278" width="168" height="32" rx="8" fill="#fbbf24" opacity="0.95"/>
    <!-- Band line accents -->
    <line x1="56" y1="294" x2="184" y2="294" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Pulse / Heartbeat Line Across Lower Section -->
  <path d="M70 410 L170 410 L200 375 L225 440 L256 345 L285 430 L310 395 L340 410 L442 410" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Glowing indicator dot -->
  <circle cx="256" cy="345" r="8" fill="#fef08a"/>
</svg>
